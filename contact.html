    <main>
      <div class="container mt-5 mb-5">
        <div

        >
          <div class="row g-0">
            <!-- Aside links -->
            <aside class="col-md-4 p-4">
              <div class="card h-100 border-0 rounded-0 bg-transparent">
                <img
                  src="afbeeldingen/contact.jpg"
                  class="card-img-top rounded-3"
                  alt="Contact"
                />
                <div class="card-body px-0">
                  <h5 class="card-title">Contact</h5>
                  <p class="card-text">
                    Vul het formulier in om contact met mij op te nemen. Ik zal
                    binnen 24 uur reageren op uw bericht.
                  </p>
                </div>
              </div>
            </aside>

            <!-- Contactformulier rechts -->
            <section class="contact-form col-md-8 p-4 p-md-5">
              <h1 class="text-center mb-4">Contactformulier</h1>
              <form action="verstuur.php" method="POST">
                <input
                  type="text"
                  name="website"
                  style="display: none"
                  tabindex="-1"
                  autocomplete="off"
                />
                <div class="mb-3">
                  <label for="name" class="form-label">Naam</label>
                  <input
                    type="text"
                    class="form-control"
                    id="name"
                    name="name"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label">E-mailadres</label>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="message" class="form-label">Bericht</label>
                  <textarea
                    class="form-control"
                    id="message"
                    name="message"
                    rows="5"
                    required
                  ></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Verstuur</button>
              </form>
            </section>
          </div>
        </div>
      </div>
